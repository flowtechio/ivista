.duration-500 {

:root{
  --purple:#4A1D9B;
  --purple-2:#5A2BB5;
  --teal:#12A5C6;
  --navy:#14052E;
  --ink:#1B1230;
  --muted:#655E7D;
  --lav:#F3EEFF;
  --lav-2:#EDE7FB;
  --surface:#FFFFFF;
  --paper:#FBF9FF;
  --line:#E4DCF8;
}

@media (prefers-color-scheme: dark){
  :root{
    --purple:#8B63E8;
    --purple-2:#6B41D6;
    --teal:#3ACDEE;
    --navy:#0B031B;
    --ink:#F5F1FF;
    --muted:#C3BADD;
    --lav:#21143F;
    --lav-2:#2A1C4F;
    --surface:#180E31;
    --paper:#120A28;
    --line:#382A63;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Manrope",ui-sans-serif,system-ui,sans-serif
}

.font-display{
  font-family:"Fraunces",Georgia,serif
}

.text-balance{
  text-wrap:balance
}

.gradient-text{
  background:linear-gradient(92deg,#5A2BB5 8%,#12A5C6 88%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

@keyframes hero-float{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-12px)
  }
}

@keyframes hero-orb{
  0%,100%{
    transform:translateY(0) scale(1);
    opacity:.9
  }

  50%{
    transform:translateY(10px) scale(1.04);
    opacity:1
  }
}

@keyframes hero-dot{
  0%,100%{
    transform:translateY(0);
    opacity:.75
  }

  50%{
    transform:translateY(-8px);
    opacity:1
  }
}

.hero-float{
  animation:hero-float 6s ease-in-out infinite
}

.hero-float-delay{
  animation-delay:1.4s
}

.hero-orb{
  animation:hero-orb 9s ease-in-out infinite
}

.hero-orb-delay{
  animation-delay:2s
}

.hero-dot{
  animation:hero-dot 5s ease-in-out infinite
}

.hero-dot-delay{
  animation-delay:1.8s
}

.card-shadow{
  box-shadow:0 18px 45px rgba(74,29,155,.10)
}

.card-shadow-2{
  box-shadow:0 24px 60px rgba(20,5,46,.18)
}

.ring-soft{
  box-shadow:0 0 0 1px var(--line)
}

::-moz-selection{
  background:#12A5C6;
  color:white
}

::selection{
  background:#12A5C6;
  color:white
}

@keyframes scroll-fab-ring{
  0%{
    transform:scale(1);
    opacity:.75
  }

  100%{
    transform:scale(1.55);
    opacity:0
  }
}

@keyframes scroll-fab-swap{
  from{
    opacity:0;
    transform:translateY(5px) scale(.94)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

.scroll-fab-ring{
  animation:scroll-fab-ring 1.35s ease-out infinite
}

.scroll-fab-swap{
  animation:scroll-fab-swap .28s ease-out both
}

@media (prefers-reduced-motion: reduce){
  .scroll-fab-ring,.scroll-fab-swap,.hero-float,.hero-orb,.hero-dot{
    animation:none
  }
}

@keyframes portfolio-in{
  from{
    opacity:0;
    transform:translateY(12px) scale(.98)
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1)
  }
}

.portfolio-card{
  animation:portfolio-in .38s ease-out both
}

@media (prefers-reduced-motion: reduce){
  .portfolio-card{
    animation:none
  }
}
