<style>
:root{--ink:#14052E;--purple:#4A1D9B;--cyan:#12A5C6;--sky:#3ACDEE;--lav:#F3EEFF;--muted:#655E7D;--line:#E4DCF8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Manrope",ui-sans-serif,system-ui,sans-serif;background:var(--lav);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
.font-display{font-family:"Fraunces",Georgia,serif}
header{background:var(--ink);padding:18px 20px}
header .wrap{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:12px}
header img{height:44px;width:auto;border-radius:12px;background:#fff;padding:5px}
header .name{color:#fff;font-weight:700;font-size:18px}
header a.home{margin-left:auto;color:var(--sky);text-decoration:none;font-weight:700;font-size:14px}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px 64px}
.card{background:#fff;border-radius:28px;box-shadow:0 24px 60px rgba(20,5,46,.12);max-width:640px;width:100%;padding:36px 32px 40px}
@media(min-width:640px){.card{padding:48px 56px}}
h1{font-size:34px;font-weight:600;line-height:1.1}
p.sub{margin-top:12px;color:var(--muted);line-height:1.6;font-size:15px}
form{margin-top:28px;display:flex;flex-direction:column;gap:18px}
label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--purple);margin-bottom:7px}
input,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font-size:15px;font-family:inherit;color:var(--ink);background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(18,165,198,.18)}
textarea{resize:vertical;min-height:120px}
.row{display:grid;gap:18px}
@media(min-width:560px){.row{grid-template-columns:1fr 1fr}}
button{margin-top:8px;background:var(--cyan);color:#fff;border:none;border-radius:999px;padding:16px 28px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 10px 28px rgba(18,165,198,.35);transition:background .15s ease}
button:hover{background:#0E8BA8}
.alt{margin-top:20px;text-align:center;font-size:14px;color:var(--muted)}
.alt a{color:var(--purple);font-weight:800;text-decoration:none}
footer.site{background:var(--ink);color:rgba(255,255,255,.6);text-align:center;padding:18px;font-size:13px}
</style>
